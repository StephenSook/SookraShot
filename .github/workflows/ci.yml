name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build app
        run: |
          xcodebuild -project SookraShot.xcodeproj -scheme SookraShot \
            -configuration Debug CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO build

      - name: Run package tests
        run: swift test --package-path Packages/SookraShotKit
