name: SookraShot
options:
  bundleIdPrefix: com.sookra
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  SookraShotKit:
    path: Packages/SookraShotKit

targets:
  SookraShot:
    type: application
    platform: macOS
    sources:
      - App/Sources
    dependencies:
      - package: SookraShotKit
        products:
          - SharedKit
          - CaptureKit
          - OverlayKit
          - HotkeyKit
          - QuickAccessKit
          - ExportKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: SookraShot
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "26.0"
        NSMicrophoneUsageDescription: "SookraShot uses the microphone only when you enable mic audio in screen recordings."
        CFBundleURLTypes:
          - CFBundleURLName: com.sookra.SookraShot
            CFBundleURLSchemes:
              - sookrashot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sookra.SookraShot
        MARKETING_VERSION: "0.1.0"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        # Ad-hoc until an Apple ID is added in Xcode > Settings > Accounts.
        # Then switch to Apple Development so TCC grants survive rebuilds.
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: false
        ENABLE_USER_SCRIPT_SANDBOXING: true
