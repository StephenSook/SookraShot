name: SookraShot
options:
  bundleIdPrefix: com.sookra
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  SookraShotKit:
    path: Packages/SookraShotKit

targets:
  SookraShot:
    type: application
    platform: macOS
    sources:
      - App/Sources
      - path: App/Resources
        buildPhase: resources
    dependencies:
      - package: SookraShotKit
        products:
          - SharedKit
          - CaptureKit
          - OverlayKit
          - HotkeyKit
          - QuickAccessKit
          - ExportKit
          - OCRKit
          - AnnotationKit
          - RecordingKit
          - ScrollCaptureKit
          - PinKit
          - HistoryKit
          - AIKit
          - CloudShareKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: SookraShot
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "26.0"
        CFBundleIconFile: AppIcon
        NSMicrophoneUsageDescription: "SookraShot uses the microphone only when you enable mic audio in screen recordings."
        CFBundleURLTypes:
          - CFBundleURLName: com.sookra.SookraShot
            CFBundleURLSchemes:
              - sookrashot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sookra.SookraShot
        MARKETING_VERSION: "0.1.0"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        # Stable Apple Development identity so the TCC Screen Recording grant
        # survives rebuilds (personal team, free Apple ID).
        DEVELOPMENT_TEAM: Y8XVCMLQCZ
        CODE_SIGN_IDENTITY: "Apple Development"
        ENABLE_HARDENED_RUNTIME: false
        ENABLE_USER_SCRIPT_SANDBOXING: true
